<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <title>Contact | Miguel Lara Portfolio</title>
</head>

<body>
    <header>
        <svg width="60" height="60" aria-label="Simple circle logo">
            <circle cx="30" cy="30" r="20"></circle>
        </svg>

        <h1>Contact</h1>

        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="projects.html">Projects</a></li>
                <li><a href="experience.html">Experience</a></li>
                <li><a href="contact.html">Contact</a></li>
                <li><a href="experiments.html">Experiments</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section>
            <h2>Send a Message</h2>

            <form>
                <fieldset>
                    <legend>Contact Information</legend>

                    <p>
                        <label for="name">Name:</label><br>
                        <input type="text" id="name" name="name">
                    </p>

                    <p>
                        <label for="email">Email:</label><br>
                        <input type="email" id="email" name="email">
                    </p>

                    <p>
                        <label for="message">Message:</label><br>
                        <textarea id="message" name="message" rows="6" cols="40"></textarea>
                    </p>

                    <button type="submit">Send Message</button>
                </fieldset>
            </form>
        </section>

        <section>
            <h2>Contact Notice</h2>
        
            <dialog open>
                <p>
                    This contact form is currently a structural demonstration and does
                    not send messages yet.
                </p>
            </dialog>
        </section>
    </main>
    
    <noscript>
        <p>This site works without JavaScript, but the console custom element will not run.</p>
    </noscript>

    <footer>
        <p>&copy; 2026 Miguel Lara</p>
    </footer>
</body>
</html>
