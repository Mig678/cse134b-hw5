<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120" role="img" aria-labelledby="t">
  <title id="t">A wedge of soft-ripened brie with a bloomy white rind</title>
  <!-- wedge body: point at left, wide rind at right -->
  <path d="M12 78 L128 44 L128 96 Z" fill="#f6e7bf"/>
  <!-- cut face highlight -->
  <path d="M12 78 L128 44 L128 58 L26 78 Z" fill="#faf0d6"/>
  <!-- bloomy rind on the wide end -->
  <rect x="126" y="42" width="16" height="56" rx="7" fill="#f7f3ea" stroke="#ded5c2" stroke-width="2"/>
  <!-- soft paste oozing at the point -->
  <path d="M12 78 q8 8 20 6 l-4 8 q-12 2 -18 -6 z" fill="#f2dfa8"/>
</svg>